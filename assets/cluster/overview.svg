<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="226" viewBox="0 0 1400 226" role="img" aria-label="Snapshot of the three-node CPU-only cluster and archived operational metrics">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091220"/><stop offset=".65" stop-color="#101c2d"/><stop offset="1" stop-color="#0b1526"/></linearGradient>
    <linearGradient id="purplecyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b59cff"/><stop offset="1" stop-color="#68e0ef"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b1fb77"/><stop offset="1" stop-color="#68e0ef"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#6f9cce" stroke-width=".8" opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect x="0" y="0" width="1400" height="226" rx="0" fill="url(#bg)" />
    <rect x="0" y="0" width="1400" height="226" rx="0" fill="url(#grid)" />
    <rect x="22" y="22" width="1356" height="182" rx="20" fill="#102037" stroke="#36506f" stroke-width="1" /><text x="55" y="89" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="45" font-weight="760" fill="#b1fb77" opacity="1">03 / 04</text><text x="55" y="125" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#eaf4ff" opacity="1">NODES ACTIVE</text><text x="55" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#99adc6" opacity="1">Fourth was planned</text><line x1="375" y1="48" x2="375" y2="178" stroke="#304862" stroke-width="2" opacity="1"/><text x="393" y="89" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="45" font-weight="760" fill="#68e0ef" opacity="1">48 GB</text><text x="393" y="125" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#eaf4ff" opacity="1">INSTALLED RAM</text><text x="393" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#99adc6" opacity="1">16 GB per node</text><line x1="713" y1="48" x2="713" y2="178" stroke="#304862" stroke-width="2" opacity="1"/><text x="731" y="89" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="45" font-weight="760" fill="#b59cff" opacity="1">24</text><text x="731" y="125" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#eaf4ff" opacity="1">LOGICAL THREADS</text><text x="731" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#99adc6" opacity="1">3 × Core i7-4770</text><line x1="1051" y1="48" x2="1051" y2="178" stroke="#304862" stroke-width="2" opacity="1"/><text x="1069" y="89" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="45" font-weight="760" fill="#ffcc8f" opacity="1">&lt; 1 ms</text><text x="1069" y="125" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#eaf4ff" opacity="1">LAN LATENCY</text><text x="1069" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#99adc6" opacity="1">Recorded environment</text></svg>