<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="676" viewBox="0 0 1400 676" role="img" aria-label="Archived aggregate generation throughput in tokens per second for two and three nodes with distinct concurrent request counts, observed on September 21, 2026.">
