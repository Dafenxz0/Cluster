<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Historical request-level architecture with FastAPI gateway, Ray, and three independent llama.cpp model replicas; experimental cross-host RPC in a separate lane">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091220"/><stop offset=".65" stop-color="#101c2d"/><stop offset="1" stop-color="#0b1526"/></linearGradient>
    <linearGradient id="purplecyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b59cff"/><stop offset="1" stop-color="#68e0ef"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b1fb77"/><stop offset="1" stop-color="#68e0ef"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#6f9cce" stroke-width=".8" opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect x="0" y="0" width="1400" height="700" rx="0" fill="url(#bg)" />
    <rect x="0" y="0" width="1400" height="700" rx="0" fill="url(#grid)" />
    <text x="58" y="70" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="26" font-weight="760" fill="#eaf4ff" opacity="1">01  /  REQUEST-LEVEL SCALING</text><text x="60" y="105" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#99adc6" opacity="1">Every machine runs its own model. The gateway schedules independent requests.</text><rect x="58" y="140" width="280" height="122" rx="15" fill="#16273d" stroke="#4c647e" stroke-width="1" /><text x="80" y="182" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#b1fb77" opacity="1">CLIENTS</text><text x="80" y="219" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#eaf4ff" opacity="1">Open WebUI / SDK / curl</text><rect x="446" y="140" width="300" height="122" rx="15" fill="#162b3f" stroke="#68e0ef" stroke-width="1" /><text x="470" y="182" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="19" font-weight="750" fill="#68e0ef" opacity="1">API GATEWAY  :9000</text><text x="470" y="219" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="450" fill="#eaf4ff" opacity="1">Routing  /  SSE  /  retries</text><path d="M 338 201 H 443" stroke="#68e0ef" stroke-width="4" fill="none"/><path d="M 428 192 L 445 201 428 210" stroke="#68e0ef" stroke-width="4" fill="none"/><rect x="836" y="140" width="505" height="321" rx="18" fill="#132239" stroke="#456482" stroke-width="1" /><text x="860" y="176" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#99adc6" opacity="1">INDEPENDENT INFERENCE REPLICAS</text><rect x="860" y="197" width="456" height="61" rx="11" fill="#1d3049" stroke="#b1fb77" stroke-width="1" /><circle cx="883" cy="227" r="7" fill="#b1fb77" opacity="1"/><text x="902" y="235" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="19" font-weight="640" fill="#eaf4ff" opacity="1">HEAD  /  llama-server :8000</text><path d="M 746 201 H 794 V 227 H 856" fill="none" stroke="#b1fb77" stroke-width="2.5"/><rect x="860" y="273" width="456" height="61" rx="11" fill="#1d3049" stroke="#68e0ef" stroke-width="1" /><circle cx="883" cy="303" r="7" fill="#68e0ef" opacity="1"/><text x="902" y="311" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="19" font-weight="640" fill="#eaf4ff" opacity="1">WORKER A  /  llama-server :8000</text><path d="M 746 201 H 794 V 303 H 856" fill="none" stroke="#68e0ef" stroke-width="2.5"/><rect x="860" y="349" width="456" height="61" rx="11" fill="#1d3049" stroke="#b59cff" stroke-width="1" /><circle cx="883" cy="379" r="7" fill="#b59cff" opacity="1"/><text x="902" y="387" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="19" font-weight="640" fill="#eaf4ff" opacity="1">WORKER B  /  llama-server :8000</text><path d="M 746 201 H 794 V 379 H 856" fill="none" stroke="#b59cff" stroke-width="2.5"/><text x="869" y="437" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">Each node serves its own quantized GGUF model</text><rect x="446" y="309" width="300" height="104" rx="13" fill="#192337" stroke="#6b5b95" stroke-width="1" /><text x="470" y="347" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="19" font-weight="750" fill="#b59cff" opacity="1">RAY CONTROL PLANE</text><text x="470" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#eaf4ff" opacity="1">Discovery / affinity (historical)</text><path d="M 745 355 H 794 V 413 H 834" fill="none" stroke="#b59cff" stroke-width="2" stroke-dasharray="8 7"/><line x1="58" y1="499" x2="1342" y2="499" stroke="#3f536d" stroke-width="2" opacity="1"/><text x="58" y="548" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="24" font-weight="740" fill="#eaf4ff" opacity="1">02  /  CROSS-HOST MODEL EXECUTION</text><text x="60" y="583" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#99adc6" opacity="1">Separate experiment: llama.cpp RPC distributes model work, not client requests.</text><rect x="58" y="610" width="387" height="54" rx="12" fill="#1c2b3f" stroke="#ffcc8f" stroke-width="1" /><text x="80" y="644" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="600" fill="#eaf4ff" opacity="1">MASTER : llama.cpp RPC client</text><rect x="556" y="610" width="319" height="54" rx="12" fill="#1c2b3f" stroke="#5f9c9d" stroke-width="1" /><text x="578" y="644" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#eaf4ff" opacity="1">RPC WORKER A  /  CPU</text><rect x="976" y="610" width="360" height="54" rx="12" fill="#1c2b3f" stroke="#5f9c9d" stroke-width="1" /><text x="998" y="644" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#eaf4ff" opacity="1">RPC WORKER B  /  CPU</text><line x1="445" y1="637" x2="550" y2="637" stroke="#68e0ef" stroke-width="3" opacity="1" stroke-dasharray="10 6"/><line x1="875" y1="637" x2="969" y2="637" stroke="#68e0ef" stroke-width="3" opacity="1" stroke-dasharray="10 6"/></svg>