<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="805" viewBox="0 0 1400 805" role="img"><title>Two distinct inference distribution strategies</title><rect width="1400" height="805" fill="#050605"/><text x="56" y="57" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="600" fill="#2EC86D">CLUSTER / 01</text><text x="56" y="124" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="650" fill="#F4F6F2">Two ways of distributing inference.</text><text x="56" y="166" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#A7AFA8">Request-level scheduling is not the same as splitting one model across multiple hosts.</text><line x1="56" y1="190" x2="1344" y2="190" stroke="#E3ECE3" stroke-width="1" opacity="0.6"/><text x="56" y="242" font-family="IBM Plex Mono,Consolas,monospace" font-size="17" font-weight="600" fill="#2EC86D">A / REQUEST-LEVEL ROUTING</text><text x="1035" y="242" font-family="IBM Plex Mono,Consolas,monospace" font-size="12" font-weight="400" fill="#A7AFA8">PRIMARY MEASURED PATH</text><line x1="56" y1="253" x2="1344" y2="253" stroke="#E3ECE3" stroke-width="1" opacity="0.4"/><rect x="56" y="292" width="242" height="158" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="77" y="324" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" font-weight="500" fill="#2EC86D">CLIENTS</text><text x="77" y="365" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F6F2">Open WebUI</text><text x="77" y="399" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" font-weight="400" fill="#A7AFA8">SDK / curl / apps</text><text x="77" y="423" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">Multi-user requests</text><rect x="390" y="292" width="288" height="158" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="414" y="324" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" font-weight="500" fill="#2EC86D">ROUTING / :9000</text><text x="414" y="364" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F6F2">FastAPI gateway</text><text x="414" y="400" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">health • retry • streaming</text><text x="414" y="424" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">Historical: round-robin</text><line x1="298" y1="367" x2="390" y2="367" stroke="#E3ECE3" stroke-width="1" opacity="1"/><circle cx="333" cy="367" r="3" fill="#2EC86D"/><line x1="678" y1="367" x2="756" y2="367" stroke="#E3ECE3" stroke-width="1" opacity="1"/><circle cx="716" cy="367" r="3" fill="#2EC86D"/><rect x="756" y="270" width="588" height="219" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="778" y="306" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">INDEPENDENT GGUF REPLICAS</text><rect x="779" y="324" width="542" height="41" rx="0" fill="none" stroke="#E3ECE3" stroke-width="0.75" opacity="1"/><text x="799" y="352" font-family="IBM Plex Mono,Consolas,monospace" font-size="16" font-weight="500" fill="#2EC86D">01</text><text x="877" y="352" font-family="IBM Plex Mono,Consolas,monospace" font-size="17" font-weight="500" fill="#F4F6F2">HEAD  /  :8000</text><text x="1115" y="351" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" font-weight="400" fill="#A7AFA8">llama-server</text><rect x="779" y="374" width="542" height="41" rx="0" fill="none" stroke="#E3ECE3" stroke-width="0.75" opacity="1"/><text x="799" y="402" font-family="IBM Plex Mono,Consolas,monospace" font-size="16" font-weight="500" fill="#2EC86D">02</text><text x="877" y="402" font-family="IBM Plex Mono,Consolas,monospace" font-size="17" font-weight="500" fill="#F4F6F2">WORKER A  /  :8000</text><text x="1115" y="401" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" font-weight="400" fill="#A7AFA8">llama-server</text><rect x="779" y="424" width="542" height="41" rx="0" fill="none" stroke="#E3ECE3" stroke-width="0.75" opacity="1"/><text x="799" y="452" font-family="IBM Plex Mono,Consolas,monospace" font-size="16" font-weight="500" fill="#2EC86D">03</text><text x="877" y="452" font-family="IBM Plex Mono,Consolas,monospace" font-size="17" font-weight="500" fill="#F4F6F2">WORKER B  /  :8000</text><text x="1115" y="451" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" font-weight="400" fill="#A7AFA8">llama-server</text><text x="58" y="514" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">Ray discovery and affinity were explored earlier; the published gateway code is a reference reconstruction.</text><line x1="56" y1="530" x2="1344" y2="530" stroke="#E3ECE3" stroke-width="1" opacity="0.8"/><text x="56" y="579" font-family="IBM Plex Mono,Consolas,monospace" font-size="17" font-weight="500" fill="#2EC86D">B / CROSS-HOST RPC</text><text x="1090" y="578" font-family="IBM Plex Mono,Consolas,monospace" font-size="12" font-weight="400" fill="#A7AFA8">SEPARATE EXPERIMENT</text><text x="56" y="620" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#F4F6F2">One larger model. Multiple CPU backends. Network overhead sits in the inference path.</text><rect x="56" y="644" width="402" height="102" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="76" y="674" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" font-weight="500" fill="#2EC86D">MASTER</text><text x="76" y="711" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#F4F6F2">RPC client + local CPU</text><text x="76" y="734" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#A7AFA8">Model split, not request routing</text><line x1="458" y1="692" x2="499" y2="692" stroke="#E3ECE3" stroke-width="1" opacity="1"/><circle cx="476" cy="692" r="3" fill="#2EC86D"/><rect x="499" y="644" width="402" height="102" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="519" y="674" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" font-weight="500" fill="#2EC86D">WORKER A</text><text x="519" y="711" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#F4F6F2">Remote CPU backend</text><text x="519" y="734" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#A7AFA8">Model split, not request routing</text><line x1="901" y1="692" x2="942" y2="692" stroke="#E3ECE3" stroke-width="1" opacity="1"/><circle cx="919" cy="692" r="3" fill="#2EC86D"/><rect x="942" y="644" width="402" height="102" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="962" y="674" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" font-weight="500" fill="#2EC86D">WORKER B</text><text x="962" y="711" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#F4F6F2">Remote CPU backend</text><text x="962" y="734" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#A7AFA8">Model split, not request routing</text><text x="56" y="780" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#A7AFA8">Do not compare RPC single-model throughput with the request-routing concurrency benchmark.</text></svg>