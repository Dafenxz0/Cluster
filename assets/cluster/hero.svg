<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="CPU-only LLM cluster, archival engineering case study: three PCs, 24 logical threads, a FastAPI gateway and measured concurrent throughput.">
