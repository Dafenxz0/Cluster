<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="418" viewBox="0 0 1400 418" role="img" aria-label="Three research and engineering experiments: speculative decoding on CPU, cross-host RPC for 30B MoE, and a recovered DeepSeek conversion patch">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091220"/><stop offset=".65" stop-color="#101c2d"/><stop offset="1" stop-color="#0b1526"/></linearGradient>
    <linearGradient id="purplecyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b59cff"/><stop offset="1" stop-color="#68e0ef"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b1fb77"/><stop offset="1" stop-color="#68e0ef"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#6f9cce" stroke-width=".8" opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect x="0" y="0" width="1400" height="418" rx="0" fill="url(#bg)" />
    <rect x="0" y="0" width="1400" height="418" rx="0" fill="url(#grid)" />
    <text x="54" y="61" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="26" font-weight="740" fill="#eaf4ff" opacity="1">EXPERIMENTS  /  WHAT WE LEARNED</text><rect x="54" y="94" width="388" height="282" rx="18" fill="#15263d" stroke="#37516c" stroke-width="1" /><rect x="77" y="116" width="7" height="42" rx="3" fill="#68e0ef" /><text x="98" y="145" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#68e0ef" opacity="1">01  SPECULATIVE DECODE</text><text x="81" y="215" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="39" font-weight="760" fill="#eaf4ff" opacity="1">8.78 vs 3.61</text><text x="82" y="242" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="600" fill="#68e0ef" opacity="1">tok/s at n-max=8</text><text x="81" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">CPU contention outweighed the</text><text x="81" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">draft-model advantage.</text><text x="81" y="349" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="760" fill="#68e0ef" opacity="1">NEGATIVE RESULT</text><rect x="505" y="94" width="388" height="282" rx="18" fill="#15263d" stroke="#37516c" stroke-width="1" /><rect x="528" y="116" width="7" height="42" rx="3" fill="#b59cff" /><text x="549" y="145" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#b59cff" opacity="1">02  HYPERCLUSTER RPC</text><text x="532" y="215" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="39" font-weight="760" fill="#eaf4ff" opacity="1">30B MoE</text><text x="533" y="242" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="600" fill="#b59cff" opacity="1">7.068 tok/s recorded</text><text x="532" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">Qwen3-A3B, Q4_0, layer split.</text><text x="532" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">Historical best; not current.</text><text x="532" y="349" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="760" fill="#b59cff" opacity="1">EXPLORATORY</text><rect x="956" y="94" width="388" height="282" rx="18" fill="#15263d" stroke="#37516c" stroke-width="1" /><rect x="979" y="116" width="7" height="42" rx="3" fill="#b1fb77" /><text x="1000" y="145" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#b1fb77" opacity="1">03  DEEPSEEK CONVERTER</text><text x="983" y="215" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="39" font-weight="760" fill="#eaf4ff" opacity="1">BF16 / FP16</text><text x="984" y="242" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="17" font-weight="600" fill="#b1fb77" opacity="1">source patch recovered</text><text x="983" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">Stacks unquantized MoE experts</text><text x="983" y="315" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#99adc6" opacity="1">for a GGUF conversion path.</text><text x="983" y="349" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="760" fill="#b1fb77" opacity="1">NOT END-TO-END VERIFIED</text></svg>