<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img"><title>Archived research experiments of local cluster</title><rect width="1400" height="670" fill="#050605"/><text x="56" y="57" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="600" fill="#2EC86D">CLUSTER / 03</text><text x="56" y="124" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="650" fill="#F4F6F2">Experiments, not marketing claims.</text><text x="56" y="166" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#A7AFA8">Negative results and unvalidated code belong in the record too.</text><line x1="56" y1="190" x2="1344" y2="190" stroke="#E3ECE3" stroke-width="1" opacity="0.6"/><rect x="56" y="222" width="412" height="365" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="80" y="251" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">01 / EXPERIMENT</text><line x1="80" y1="285" x2="444" y2="285" stroke="#E3ECE3" stroke-width="1" opacity="0.6"/><text x="80" y="325" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650" fill="#F4F6F2">SPECULATIVE DECODING</text><text x="80" y="367" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#A7AFA8">CPU contention outweighed</text><text x="80" y="392" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#A7AFA8">the draft-model advantage.</text><text x="80" y="481" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="650" fill="#F4F6F2">8.78</text><text x="80" y="512" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">tok/s @ n-max=8</text><text x="80" y="541" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">3.61 tok/s recorded baseline</text><line x1="80" y1="556" x2="444" y2="556" stroke="#E3ECE3" stroke-width="1" opacity="0.5"/><text x="80" y="577" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" font-weight="400" fill="#A7AFA8">Historical experiment</text><rect x="496" y="222" width="412" height="365" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="520" y="251" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">02 / EXPERIMENT</text><line x1="520" y1="285" x2="884" y2="285" stroke="#E3ECE3" stroke-width="1" opacity="0.6"/><text x="520" y="325" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650" fill="#F4F6F2">HYPERCLUSTER RPC</text><text x="520" y="367" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#A7AFA8">Cross-host layer splitting with</text><text x="520" y="392" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#A7AFA8">Qwen3-30B-A3B MoE.</text><text x="520" y="481" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="650" fill="#2EC86D">7.068</text><text x="520" y="512" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">tok/s recorded</text><text x="520" y="541" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">Q4_0 quantization</text><line x1="520" y1="556" x2="884" y2="556" stroke="#E3ECE3" stroke-width="1" opacity="0.5"/><text x="520" y="577" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" font-weight="400" fill="#A7AFA8">Separate RPC architecture</text><rect x="936" y="222" width="412" height="365" rx="0" fill="none" stroke="#E3ECE3" stroke-width="1" opacity="1"/><text x="960" y="251" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">03 / EXPERIMENT</text><line x1="960" y1="285" x2="1324" y2="285" stroke="#E3ECE3" stroke-width="1" opacity="0.6"/><text x="960" y="325" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650" fill="#F4F6F2">DEEPSEEK PATCH</text><text x="960" y="367" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#A7AFA8">BF16/FP16 expert conversion</text><text x="960" y="392" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#A7AFA8">path recovered from source.</text><text x="960" y="481" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="650" fill="#2EC86D">4.7 KB</text><text x="960" y="512" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" font-weight="500" fill="#2EC86D">recovered patch</text><text x="960" y="541" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A7AFA8">73 additions / 5 deletions</text><line x1="960" y1="556" x2="1324" y2="556" stroke="#E3ECE3" stroke-width="1" opacity="0.5"/><text x="960" y="577" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" font-weight="400" fill="#A7AFA8">Not validated end to end</text><text x="56" y="636" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#A7AFA8">Recovered patch is authentic. Conversion completion, numerical equivalence, and inference speedup remain unverified.</text></svg>